# RUN-002: review a reproducible artifact before creating a protected release tag.
name: Runtime CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Reproducible runtime build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install frozen test dependencies
        run: npm ci --prefix runtime --ignore-scripts --no-audit --no-fund
      - name: Release verification contracts
        run: node --test test/release-promotion.test.mjs test/local-metrics.test.mjs
      - name: Build twice and compare bytes
        run: |
          set -euo pipefail
          version="$(node -p 'require("./runtime/package.json").version')"
          node scripts/release.mjs build --tag "runtime-v$version" --out out
          node --check out/runtime.mjs
      - name: Build the Databricks wheel twice and compare bytes
        if: hashFiles('runtime/databricks/pyproject.toml') != ''
        env:
          RELEASE_KIND: databricks
        run: |
          set -euo pipefail
          python3 -m pip install --user "uv==0.12.5"
          version="$(node scripts/release.mjs version)"
          node scripts/release.mjs build --tag "databricks-v$version" --out out-databricks
