# RUN-002: review a reproducible artifact before creating a protected release tag.
name: Runtime CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Reproducible runtime build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build twice and compare bytes
        run: |
          set -euo pipefail
          version="$(node -p 'require("./runtime/package.json").version')"
          node scripts/release.mjs build --tag "runtime-v$version" --out out
          node --check out/runtime.mjs
