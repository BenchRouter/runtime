<form method="post" action="/connect">
  <input type="hidden" name="catalog" value="{{ binding.catalog }}">
  <input type="hidden" name="schema" value="{{ binding.schema }}">
  <input type="hidden" name="warehouse_id" value="{{ binding.warehouse_id }}">
  <input type="hidden" name="results_reader" value="{{ binding.results_reader or '' }}">
  <button class="quiet" type="submit">Connect again</button>
</form>
